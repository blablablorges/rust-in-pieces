# Identical to with-syntheticservice-wasm except image, runtimeClassName and the
# WASIHOST_* knobs the A shim reads from the pod env.
apiVersion: v1
kind: ConfigMap
metadata:
  name: syntheticservice-stress-level
data:
  CPU_LEVEL: "0"
  MEMORY_LEVEL: "0"
  IO_LEVEL: "0"
  NETWORK_LEVEL: "0"
  DB_LEVEL: "0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: syntheticservice
  labels:
    app: syntheticservice
spec:
  selector:
    matchLabels:
      app: syntheticservice
  template:
    metadata:
      labels:
        app: syntheticservice
    spec:
      serviceAccountName: syntheticservice
      runtimeClassName: wasmtime-p3
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        image: syntheticservice-p3
        ports:
        - containerPort: 50055
        # WP-K0: Ready means the health RPC answered; same probe on both sides.
        readinessProbe:
          grpc:
            port: 50055
          periodSeconds: 2
          failureThreshold: 3
        env:
        - name: PORT
          value: "50055"
        - name: PRODUCT_CATALOG_SERVICE_ADDR
          value: "productcatalogservice:3550"
        - name: REDIS_ADDR
          value: "redis-cart:6379"
        - name: WASIHOST_H2C_AUTHORITIES
          value: "productcatalogservice:3550"
        - name: WASIHOST_INSTANCE_REUSE
          value: "0"
        - name: WASIHOST_INSTANCE_CONCURRENCY
          value: "16"
        # inject stress level from configmap:
        envFrom:
        - configMapRef:
            name: syntheticservice-stress-level
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 200m
            memory: 4096Mi
        volumeMounts:
          - name: tmp
            mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: syntheticservice
  labels:
    app: syntheticservice
spec:
  type: ClusterIP
  selector:
    app: syntheticservice
  ports:
  - name: grpc
    port: 50055
    targetPort: 50055
---
apiVersion: v1
kind: Service
metadata:
  name: syntheticservice-external
  labels:
    app: syntheticservice
spec:
  type: NodePort
  selector:
    app: syntheticservice
  ports:
  - name: grpc
    port: 50055
    targetPort: 50055
    nodePort: 30055
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: syntheticservice
