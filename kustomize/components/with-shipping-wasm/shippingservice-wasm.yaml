apiVersion: apps/v1
kind: Deployment
metadata:
  name: shippingservice
spec:
  selector:
    matchLabels:
      app: shippingservice
  replicas: 1
  template:
    metadata:
      labels:
        app: shippingservice
    spec:
      containers:
      - env:
        - name: WASMTIME_HTTP_PROXY_SOCKET_ADDR
          value: "0.0.0.0:8080"
        - name: WASMTIME_HTTP_PROXY_ENABLE
          value: "1"
        - name: WASMTIME_HTTP_PROXY_BACKLOG
          value: "128"
        - name: WASMTIME_HTTP_PROXY_SERVER_MODE
          value: h2
        image: ghcr.io/containerd/runwasi/shippingserwasm:latest
        imagePullPolicy: Never
        name: shippingservice-wasi
        ports:
        - containerPort: 8080
          protocol: TCP
        resources:
          limits:
            cpu: 200m
            memory: 128Mi
          requests:
            cpu: 100m
            memory: 64Mi
      dnsPolicy: ClusterFirst
      nodeSelector:
        runtime: wasmtime
      restartPolicy: Always
      runtimeClassName: wasmtime
---
apiVersion: v1
kind: Service
metadata:
  name: shippingservice
  labels:
    app: shippingservice
spec:
  type: ClusterIP
  selector:
    app: shippingservice
  ports:
  - name: grpc
    port: 8080
    protocol: TCP
    targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shippingservice