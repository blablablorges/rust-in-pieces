#
# with-cart-wasm with image, runtimeClassName and the WASIHOST_* knobs changed, plus an
# explicit PORT env (the host reads it; the P2 binary defaults it). Under wasmtime-p3
# the host proxy owns the listener on PORT and instantiates the guest per concurrent
# request (reuse unbounded), so per-instance state (datastore sockets; geo's index) is
# built per instance, not once per pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice
  labels:
    app: cartservice
spec:
  selector:
    matchLabels:
      app: cartservice
  template:
    metadata:
      labels:
        app: cartservice
    spec:
      runtimeClassName: wasmtime-p3
      serviceAccountName: cartservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: cartserp3
        ports:
        - containerPort: 7070
        readinessProbe:
          grpc:
            port: 7070
          periodSeconds: 2
          failureThreshold: 3
        env:
        - name: PORT
          value: "7070"
        - name: REDIS_ADDR
          value: "redis-cart:6379"
        - name: WASIHOST_INSTANCE_REUSE
          value: "0"
        - name: WASIHOST_INSTANCE_CONCURRENCY
          value: "16"
        resources:
          requests:
            cpu: 200m
            memory: 64Mi
          limits:
            cpu: 1000m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cartservice
  labels:
    app: cartservice
spec:
  type: ClusterIP
  selector:
    app: cartservice
  ports:
  - name: grpc
    port: 7070
    targetPort: 7070
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cartservice
