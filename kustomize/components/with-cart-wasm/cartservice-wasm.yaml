apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice
spec:
  selector:
    matchLabels:
      app: cartservice
  template:
    metadata:
      labels:
        app: cartservice
    spec:
      containers:
      - name: server
        image: ghcr.io/containerd/runwasi/cartserwasm:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 7070
        env:
        - name: PORT
          value: "7070"
        - name: REDIS_ADDR
          value: "redis-cart:6379"
        # Declares the upstream to the shim's host-side pooled-tcp interface,
        # with `resp` selecting RESP reply framing. Without it the shim rejects
        # every call with TcpError::UnknownUpstream("redis-cart:6379") and the
        # cart silently stores nothing — REDIS_ADDR above is only the guest's
        # own view and grants no access on its own.
        # Format is `authority=framing[,authority=framing]`; see
        # containerd-shim-wasmtime/src/raw_tcp.rs RawTcpConfig::from_env.
        - name: WASMTIME_RAWTCP_UPSTREAMS
          value: "redis-cart:6379=resp"
        - name: WASMTIME_HTTP_PROXY_SOCKET_ADDR
          value: "0.0.0.0:7070"
        - name: WASMTIME_HTTP_PROXY_ENABLE
          value: "1"
        - name: WASMTIME_HTTP_PROXY_BACKLOG
          value: "128"
        - name: WASMTIME_HTTP_PROXY_SERVER_MODE
          value: h2
        - name: WASMTIME_HTTP_PROXY_ALLOW_NETWORK
          value: "true"
        resources:
          requests:
            cpu: 200m
            memory: 64Mi
          limits:
            cpu: 300m
            memory: 128Mi
      nodeSelector:
        runtime: wasmtime
      restartPolicy: Always
      runtimeClassName: wasmtime
---
apiVersion: v1
kind: Service
metadata:
  name: cartservice
  labels:
    app: cartservice
spec:
  type: ClusterIP
  selector:
    app: cartservice
  ports:
  - name: grpc
    port: 7070
    targetPort: 7070
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cartservice
---

