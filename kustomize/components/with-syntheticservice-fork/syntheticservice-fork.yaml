apiVersion: v1
kind: ConfigMap
metadata:
  name: syntheticservice-stress-level
data:
  CPU_LEVEL: "0"
  MEMORY_LEVEL: "0"
  IO_LEVEL: "0"
  NETWORK_LEVEL: "0"
  DB_LEVEL: "0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: syntheticservice
  labels:
    app: syntheticservice
spec:
  selector:
    matchLabels:
      app: syntheticservice
  template:
    metadata:
      labels:
        app: syntheticservice
    spec:
      runtimeClassName: wasmtime-fork
      serviceAccountName: syntheticservice
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        image: syntheticservicefork
        ports:
        - containerPort: 8080
        # WP-K0: Ready means the health RPC answered; same probe on both sides.
        readinessProbe:
          grpc:
            port: 8080
          periodSeconds: 2
          failureThreshold: 3
        env:
        - name: PORT
          value: "50055"
        - name: PRODUCT_CATALOG_SERVICE_ADDR
          value: "productcatalogservice:3550"
        - name: REDIS_ADDR
          value: "redis-cart:6379"
        - name: WASMTIME_HTTP_PROXY_ENABLE
          value: "1"
        - name: WASMTIME_HTTP_PROXY_SOCKET_ADDR
          value: "0.0.0.0:8080"
        - name: WASMTIME_HTTP_PROXY_SERVER_MODE
          value: "auto"
        - name: WASMTIME_HTTP_PROXY_ALLOW_NETWORK
          value: "true"
        - name: WASMTIME_HTTP_PROXY_OUTBOUND_DEFAULT
          value: "h2c"
        - name: WASMTIME_HTTP_PROXY_INSTANCE_REUSE
          value: "1"
        # inject stress level from configmap:
        envFrom:
        - configMapRef:
            name: syntheticservice-stress-level
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            cpu: 200m
            memory: 4096Mi
        volumeMounts:
          - name: tmp
            mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: syntheticservice
  labels:
    app: syntheticservice
spec:
  type: ClusterIP
  selector:
    app: syntheticservice
  ports:
  - name: grpc
    port: 50055
    targetPort: 50055
---
apiVersion: v1
kind: Service
metadata:
  name: syntheticservice-external
  labels:
    app: syntheticservice
spec:
  type: NodePort
  selector:
    app: syntheticservice
  ports:
  - name: grpc
    port: 50055
    targetPort: 50055
    nodePort: 30055
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: syntheticservice
