# Default credentials: none. Overwritten on bare metal by the Ansible role
# install_sut_repo, which templates registry-credentials.j2 over this path from
# the `registry_credentials` variable.
#
# This file has to exist or NOTHING renders: kustomization.yaml lists it under
# `patches:`, and kustomize fails to load a patch file that is absent — so a
# fresh checkout could not `kustomize build` any of the seven overlays, and
# neither could the local kind testbed. It was previously only ever created by
# Ansible on the control plane, which is why that went unnoticed.
#
# Its *contents* are inert either way. The patch targets a Secret named
# registry-credentials, no such Secret exists in base/, so the target selector
# matches nothing and kustomize emits no Secret at all. Only the sibling
# imagePullSecret.yaml does real work, adding
# `imagePullSecrets: [registry-credentials]` to every Deployment — which
# kubelet treats as a warning, not an error, when no such Secret is present.
# That is exactly the situation on kind, where images are side-loaded into the
# nodes and no registry is contacted.
apiVersion: v1
kind: Secret
metadata:
  name: registry-credentials
type: kubernetes.io/dockerconfigjson
data:
  # base64 of {"auths":{}} — a valid, empty docker config.
  .dockerconfigjson: eyJhdXRocyI6e319
