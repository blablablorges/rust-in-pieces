# WP-J2: identical to components/with-recommendation-docker/recommendationservice.yaml
# except image and runtimeClassName. The guest owns its own listener on 8080 and
# dials productcatalog itself, so there is no host-side proxy and no WASMTIME_* env.

# with-recommendation-wasm with image, runtimeClassName and the WASIHOST_* knobs changed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendationservice
  labels:
    app: recommendationservice
spec:
  selector:
    matchLabels:
      app: recommendationservice
  template:
    metadata:
      labels:
        app: recommendationservice
    spec:
      runtimeClassName: wasmtime-p3
      serviceAccountName: recommendationservice
      terminationGracePeriodSeconds: 5
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
      - name: server
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          privileged: false
          readOnlyRootFilesystem: true
        image: recommendationserp3
        ports:
        - containerPort: 8080
        readinessProbe:
          grpc:
            port: 8080
          periodSeconds: 2
          failureThreshold: 3
        env:
        - name: PORT
          value: "8080"
        - name: PRODUCT_CATALOG_SERVICE_ADDR
          value: "productcatalogservice:3550"
        - name: DISABLE_PROFILER
          value: "1"
        - name: WASIHOST_H2C_AUTHORITIES
          value: "productcatalogservice:3550"
        - name: WASIHOST_INSTANCE_REUSE
          value: "0"
        - name: WASIHOST_INSTANCE_CONCURRENCY
          value: "16"
        resources:
          requests:
            cpu: 100m
            memory: 220Mi
          limits:
            cpu: 1000m
            memory: 450Mi
---
apiVersion: v1
kind: Service
metadata:
  name: recommendationservice
  labels:
    app: recommendationservice
spec:
  type: ClusterIP
  selector:
    app: recommendationservice
  ports:
  - name: grpc
    port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recommendationservice
