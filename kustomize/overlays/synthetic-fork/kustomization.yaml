
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base          # or ../../base if you have a base folder

components:
  - ../../components/with-syntheticservice-fork
  - ../../components/with-node-selector
  - ../../components/without-base
patches:
  - target:
      kind: Service
      name: syntheticservice
    patch: |-
      - op: replace
        path: /spec/ports/0/targetPort
        value: 8080
