apiVersion: skaffold/v3
kind: Config
metadata:
  name: app
build:
  #platforms: ["linux/amd64", "linux/arm64"]
  artifacts:
  # image tags are relative; to specify an image repo (e.g. GCR), you
  # must provide a "default repo" using one of the methods described
  # here:
  # https://skaffold.dev/docs/concepts/#image-repository-handling
  - image: emailservice
    context: src/emailservice
    docker:
      cacheFrom:
        - emailservice
  - image: productcatalogservice
    context: src/productcatalogservice
    docker:
      cacheFrom:
        - productcatalogservice
  - image: recommendationservice
    context: .
    docker:
      dockerfile: src/recommendationserwasm/Dockerfile
      cacheFrom:
        - recommendationservice
  - image: shoppingassistantservice
    context: src/shoppingassistantservice
    docker:
      cacheFrom:
        - shoppingassistantservice
  - image: shippingservice
    context: .
    docker:
      dockerfile: src/shippingserwasm/Dockerfile
      cacheFrom:
        - shippingservice
  - image: checkoutservice
    context: src/checkoutservice
    docker:
      cacheFrom:
        - checkoutservice
  - image: paymentservice
    context: src/paymentservice
    docker:
      cacheFrom:
        - paymentservice
  - image: currencyservice
    context: src/currencyservice
    docker:
      cacheFrom:
        - currencyservice
  - image: cartservice
    context: .
    docker:
      dockerfile: src/cartserwasm/Dockerfile
      cacheFrom:
        - cartservice
  # Upstream-language anchors for the per-service campaign (Go, Python, C#); own row, never a pair partner.
  - image: shippingservice-upstream
    context: src/shippingservice-go
    docker:
      cacheFrom:
        - shippingservice-upstream
  - image: recommendationservice-upstream
    context: src/recommendationservice
    docker:
      cacheFrom:
        - recommendationservice-upstream
  - image: cartservice-upstream
    context: src/cartservice/src
    docker:
      cacheFrom:
        - cartservice-upstream
  - image: frontend
    context: src/frontend
    docker:
      cacheFrom:
        - frontend
  - image: adservice
    context: src/adservice
    docker:
      cacheFrom:
        - adservice
  - image: syntheticservice
    context: .
    docker:
      dockerfile: src/syntheticservicewasm/Dockerfile
      cacheFrom:
        - syntheticservice
  - image: syntheticservice-p3
    context: .
    custom:
      buildCommand: hack/wasm-image.sh src/syntheticservicep3 syntheticservicep3.wasm --lib
      dependencies:
        paths: [src/syntheticservicep3/**, protos/**]
        ignore: ["**/target/**"]
  - image: shippingserp3
    context: .
    custom:
      buildCommand: hack/wasm-image.sh src/shippingserp3 shippingserp3.wasm --lib
      dependencies:
        paths: [src/shippingserp3/**, src/shippingserwasm/src/**, protos/**]
        ignore: ["**/target/**"]
  - image: recommendationserp3
    context: .
    custom:
      buildCommand: hack/wasm-image.sh src/recommendationserp3 recommendationserp3.wasm --lib
      dependencies:
        paths: [src/recommendationserp3/**, src/recommendationserwasm/src/**, src/syntheticservicep3/src/**, protos/**]
        ignore: ["**/target/**"]
  - image: cartserp3
    context: .
    custom:
      buildCommand: hack/wasm-image.sh src/cartserp3 cartserp3.wasm --lib
      dependencies:
        paths: [src/cartserp3/**, src/cartserwasm/src/**, src/syntheticservicep3/src/**, protos/**]
        ignore: ["**/target/**"]
  # Wasm components (WP-H0). Same crates as the native images above, built by
  # hack/wasm-image.sh for wasm32-wasip2 and pushed to the registry like every
  # other artifact, so the manifests name them by artifact and skaffold rewrites
  # the ref. --lib selects the cdylib component (the bins are the native builds);
  # shippingserwasm is WP-J1: one --bin server source for both targets.
  - image: shippingserwasm
    context: .
    custom:
      buildCommand: hack/wasm-image.sh src/shippingserwasm server.wasm --bin server
      dependencies:
        paths: [src/shippingserwasm/**, src/lib/**, protos/**]
        ignore: ["**/target/**"]
  - image: recommendationserwasm
    context: .
    custom:
      buildCommand: hack/wasm-image.sh src/recommendationserwasm server.wasm --bin server
      dependencies:
        paths: [src/recommendationserwasm/**, src/lib/**, protos/**]
        ignore: ["**/target/**"]
  - image: cartserwasm
    context: .
    custom:
      buildCommand: hack/wasm-image.sh src/cartserwasm server.wasm --bin server
      dependencies:
        paths: [src/cartserwasm/**, src/lib/**, protos/**]
        ignore: ["**/target/**"]
  - image: syntheticservicewasm
    context: .
    custom:
      buildCommand: hack/wasm-image.sh src/syntheticservicewasm server.wasm --bin server
      dependencies:
        paths: [src/syntheticservicewasm/**, src/lib/**, protos/**]
        ignore: ["**/target/**"]
  - image: syntheticservicefork
    context: ../rust-in-pieces-june
    custom:
      buildCommand: hack/wasm-image.sh src/syntheticservicewasm syntheticservicewasm.wasm --lib
      dependencies:
        paths: [src/syntheticservicewasm/**, src/lib/**, protos/**]
        ignore: ["**/target/**"]
  # TinyGo synthetic guest (wasi:http 0.2 proxy component), built by hack/tinygo-image.sh.
  - image: syntheticservicetinygo
    context: .
    custom:
      buildCommand: hack/tinygo-image.sh src/syntheticservicetinygo synthetic.wasm
      dependencies:
        paths: [src/syntheticservicetinygo/**]
        ignore: ["**/*.wasm"]
  tagPolicy:
    gitCommit: {}
  local:
    useDockerCLI: true
    useBuildkit: true
    tryImportMissing: true
    # Always push, kind included: wasm images cannot be `kind load`ed and every
    # image is meant to reach the node through kubelet's pull (WP-H0).
    push: true
manifests:
  kustomize:
    paths:
    - kustomize
deploy:
  kubectl: {}
profiles:
- name: debug
  activation:
  - command: debug
  patches:
  - op: replace
    path: /build/artifacts/7/docker/dockerfile
    value: Dockerfile.debug
# Additive: composes with any treatment profile (-p wasi-tcp,frontend-metrics).
# Campaign-wide only — see kustomize/addons/frontend-metrics/kustomization.yaml.
- name: frontend-metrics
  patches:
  - op: add
    path: /manifests/kustomize/paths/-
    value: kustomize/addons/frontend-metrics
# Additive (-p wasi-tcp,tester-nodeports): NodePorts for the per-service campaign.
- name: tester-nodeports
  patches:
  - op: add
    path: /manifests/kustomize/paths/-
    value: kustomize/addons/tester-nodeports
- name: baseline
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/baseline
- name: upstream
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/upstream
- name: wasi-vanilla
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/wasi-vanilla
- name: p3-vanilla
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/p3-vanilla
- name: wasi-grpc
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/wasi-grpc
- name: p3-grpc
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/p3-grpc
- name: wasi-tcp
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/wasi-tcp
- name: p3-tcp
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/p3-tcp
- name: wasi-runtime-full
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/wasi-all
- name: synthetic-baseline
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/synthetic-baseline
- name: synthetic-wasm
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/synthetic-wasm
- name: synthetic-tinygo
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/synthetic-tinygo
- name: synthetic-p3
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/synthetic-p3
- name: synthetic-fork
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/synthetic-fork
- name: baseline-with-autoscaling
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/baseline-with-autoscaling
- name: wasi-vanilla-with-autoscaling
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/wasi-vanilla-with-autoscaling
- name: wasi-grpc-with-autoscaling
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/wasi-grpc-with-autoscaling
- name: wasi-tcp-with-autoscaling
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/wasi-tcp-with-autoscaling
- name: wasi-runtime-full-with-autoscaling
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/wasi-all-with-autoscaling
- name: synthetic-baseline-with-autoscaling
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/synthetic-baseline-with-autoscaling
- name: synthetic-wasm-with-autoscaling
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/synthetic-wasm-with-autoscaling