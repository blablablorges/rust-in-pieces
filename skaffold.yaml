apiVersion: skaffold/v3
kind: Config
metadata:
  name: app
build:
  #platforms: ["linux/amd64", "linux/arm64"]
  artifacts:
  # image tags are relative; to specify an image repo (e.g. GCR), you
  # must provide a "default repo" using one of the methods described
  # here:
  # https://skaffold.dev/docs/concepts/#image-repository-handling
  - image: emailservice
    context: src/emailservice
    docker:
      cacheFrom:
        - emailservice
  - image: productcatalogservice
    context: src/productcatalogservice
    docker:
      cacheFrom:
        - productcatalogservice
  - image: recommendationserwasm
    context: src/recommendationserwasm
    docker:
      cacheFrom:
        - recommendationserwasm
  - image: shoppingassistantservice
    context: src/shoppingassistantservice
    docker:
      cacheFrom:
        - shoppingassistantservice
  - image: shippingservice
    context: .
    docker:
      dockerfile: src/shippingservice/Dockerfile
      cacheFrom:
        - shippingservice
  - image: checkoutservice
    context: src/checkoutservice
    docker:
      cacheFrom:
        - checkoutservice
  - image: paymentservice
    context: src/paymentservice
    docker:
      cacheFrom:
        - paymentservice
  - image: currencyservice
    context: src/currencyservice
    docker:
      cacheFrom:
        - currencyservice
  - image: cartservice
    context: src/cartservice/src
    docker:
      dockerfile: Dockerfile
      cacheFrom:
        - cartservice
  - image: frontend
    context: src/frontend
    docker:
      cacheFrom:
        - frontend
  - image: adservice
    context: src/adservice
    docker:
      cacheFrom:
        - adservice
  tagPolicy:
    gitCommit: {}
  local:
    useDockerCLI: true
    useBuildkit: true
    tryImportMissing: true
manifests:
  kustomize:
    paths:
    - kustomize
deploy:
  kubectl: {}
profiles:
- name: debug
  activation:
  - command: debug
  patches:
  - op: replace
    path: /build/artifacts/7/docker/dockerfile
    value: Dockerfile.debug
# The "network-policies" profile is not used by default.
# You can use it in isolation or in combination with other profiles:
#     skaffold run -p network-policies, debug
- name: baseline
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/baseline
- name: wasi-runtime
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/wasi-runtime
- name: kirin-runtime
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/with-external
- name: wasi-runtime-full
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/wasi-runtime-full