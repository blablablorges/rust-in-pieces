apiVersion: skaffold/v3
kind: Config
metadata:
  name: app
build:
  #platforms: ["linux/amd64", "linux/arm64"]
  artifacts:
  # image tags are relative; to specify an image repo (e.g. GCR), you
  # must provide a "default repo" using one of the methods described
  # here:
  # https://skaffold.dev/docs/concepts/#image-repository-handling
  - image: emailservice
    context: src/emailservice
    docker:
      cacheFrom:
        - emailservice
  - image: productcatalogservice
    context: src/productcatalogservice
    docker:
      cacheFrom:
        - productcatalogservice
  - image: recommendationservice
    context: .
    docker:
      dockerfile: src/recommendationserwasm/Dockerfile
      cacheFrom:
        - recommendationservice
  - image: shoppingassistantservice
    context: src/shoppingassistantservice
    docker:
      cacheFrom:
        - shoppingassistantservice
  - image: shippingservice
    context: .
    docker:
      dockerfile: src/shippingserwasm/Dockerfile
      cacheFrom:
        - shippingservice
  - image: checkoutservice
    context: src/checkoutservice
    docker:
      cacheFrom:
        - checkoutservice
  - image: paymentservice
    context: src/paymentservice
    docker:
      cacheFrom:
        - paymentservice
  - image: currencyservice
    context: src/currencyservice
    docker:
      cacheFrom:
        - currencyservice
  - image: cartservice
    context: .
    docker:
      dockerfile: src/cartserwasm/Dockerfile
      cacheFrom:
        - cartservice
  - image: frontend
    context: src/frontend
    docker:
      cacheFrom:
        - frontend
  - image: adservice
    context: src/adservice
    docker:
      cacheFrom:
        - adservice
  - image: syntheticservice
    context: .
    docker:
      dockerfile: src/syntheticservicewasm/Dockerfile
      cacheFrom:
        - syntheticservice
  tagPolicy:
    gitCommit: {}
  local:
    useDockerCLI: true
    useBuildkit: true
    tryImportMissing: true
manifests:
  kustomize:
    paths:
    - kustomize
deploy:
  kubectl: {}
profiles:
- name: debug
  activation:
  - command: debug
  patches:
  - op: replace
    path: /build/artifacts/7/docker/dockerfile
    value: Dockerfile.debug
# Additive: composes with any treatment profile (-p wasi-tcp,frontend-metrics).
# Campaign-wide only — see kustomize/addons/frontend-metrics/kustomization.yaml.
- name: frontend-metrics
  patches:
  - op: add
    path: /manifests/kustomize/paths/-
    value: kustomize/addons/frontend-metrics
- name: baseline
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/baseline
- name: wasi-vanilla
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/wasi-vanilla
- name: wasi-grpc
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/wasi-grpc
- name: wasi-tcp
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/wasi-tcp
- name: wasi-runtime-full
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/wasi-all
- name: synthetic-baseline
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/synthetic-baseline
- name: synthetic-wasm
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/synthetic-wasm
- name: baseline-with-autoscaling
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/baseline-with-autoscaling
- name: wasi-vanilla-with-autoscaling
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/wasi-vanilla-with-autoscaling
- name: wasi-grpc-with-autoscaling
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/wasi-grpc-with-autoscaling
- name: wasi-tcp-with-autoscaling
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/wasi-tcp-with-autoscaling
- name: wasi-runtime-full-with-autoscaling
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/wasi-all-with-autoscaling
- name: synthetic-baseline-with-autoscaling
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/synthetic-baseline-with-autoscaling
- name: synthetic-wasm-with-autoscaling
  patches:
  - op: replace
    path: /manifests/kustomize/paths/0
    value: kustomize/overlays/synthetic-wasm-with-autoscaling