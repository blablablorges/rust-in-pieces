apiVersion: skaffold/v3
kind: Config
metadata:
  name: app
build:
  #platforms: ["linux/amd64", "linux/arm64"]
  artifacts:
  # image tags are relative; to specify an image repo (e.g. GCR), you
  # must provide a "default repo" using one of the methods described
  # here:
  # https://skaffold.dev/docs/concepts/#image-repository-handling
  - image: emailservice
    context: src/emailservice
  - image: productcatalogservice
    context: src/productcatalogservice
  - image: recommendationservice
    context: src/recommendationservice
  - image: shoppingassistantservice
    context: src/shoppingassistantservice
  - image: shippingservice
    context: .
    docker:
      dockerfile: src/shippingservice/Dockerfile
  - image: checkoutservice
    context: src/checkoutservice
  - image: paymentservice
    context: src/paymentservice
  - image: currencyservice
    context: src/currencyservice
  - image: cartservice
    context: src/cartservice/src
    docker:
      dockerfile: Dockerfile
  - image: frontend
    context: src/frontend
  - image: adservice
    context: src/adservice
  tagPolicy:
    gitCommit: {}
  local:
    useDockerCLI: true
    useBuildkit: true
manifests:
  kustomize:
    paths:
    - kustomize
deploy:
  kubectl: {}
profiles:
- name: debug
  activation:
  - command: debug
  patches:
  - op: replace
    path: /build/artifacts/7/docker/dockerfile
    value: Dockerfile.debug
# The "network-policies" profile is not used by default.
# You can use it in isolation or in combination with other profiles:
#     skaffold run -p network-policies, debug
- name: registry
  patches:
  - op: add
    path: /manifests/kustomize/paths/1
    value: kustomize/components/container-images-registry
- name: baseline
  patches:
  - op: add
    path: /manifests/kustomize/paths/1
    value: kustomize/components/with-shipping-docker
- name: wasi-runtime
  patches:
  - op: add 
    path: /manifests/kustomize/paths/1
    value: kustomize/components/with-shipping-wasm
- name: kirin-runtime
  patches:
  - op: add
    path: /manifests/kustomize/paths/1
    value: kustomize/components/with-shipping-external
- name: fixed-node
  patches:
  - op: add
    path: /manifests/kustomize/paths/1
    value: kustomize/components/with-node-selector