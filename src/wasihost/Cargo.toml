[package]
name = "wasihost"
version = "0.1.0"
edition = "2021"

[dependencies]
wasmtime = { version = "48", features = ["component-model", "async", "pooling-allocator", "cranelift", "component-model-async"] }
wasmtime-wasi = { version = "48", features = ["p3"] }
wasmtime-wasi-http = { version = "48", features = ["p3", "component-model-async"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "client-legacy", "http1", "http2", "tokio"] }
http = "1"
http-body-util = "0.1"
http-body = "1"
bytes = "1"
anyhow = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
